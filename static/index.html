<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>电台排程与复核批次</title>
<style>
body{font:15px system-ui;max-width:1100px;margin:24px auto;padding:0 16px;background:#f7f7f5;color:#222}
section{background:white;padding:16px;margin:12px 0;border:1px solid #ddd;border-radius:10px}
input,select,button{padding:7px;margin:3px;border:1px solid #bbb;border-radius:6px}
button{cursor:pointer;background:#16324f;color:white}button.sec{background:#4a6b8a}
pre{white-space:pre-wrap;max-height:360px;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input{width:90%}
table{border-collapse:collapse;width:100%;margin-top:8px}
th,td{border:1px solid #ddd;padding:6px 8px;text-align:left;font-size:14px;vertical-align:top}
th{background:#eef2f6}.blocked{color:#b00020;font-weight:600}.ok{color:#1a7f37;font-weight:600}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;margin:1px}
.pill.on{background:#e6f4ea;color:#1a7f37}.pill.off{background:#fdecea;color:#b00020}
.meta{color:#666;font-size:13px}.diff{background:#fff8e1}
</style>
<h1>电台播出与版权窗口排程 · 复核批次</h1>
<section><h2>当前计划</h2><button onclick="load()">刷新</button><pre id="state"></pre></section>
<section><h2>新建节目</h2><div class="grid">
<input id="title" placeholder="节目名"><select id="kind"><option>music</option><option>ad</option><option>talk</option><option>live</option></select>
<input id="duration" type="number" value="30" placeholder="分钟"><input id="start" value="2026-01-01"><input id="end" value="2026-12-31">
<input id="region" value="华东"><input id="sponsor" placeholder="赞助商，可空"><input id="cooldown" type="number" value="0" placeholder="冷却分钟">
</div><button onclick="addProgram()">创建并授权地区</button></section>
<section><h2>排期 / 替换 / 实播对账</h2>
<div class="grid"><input id="airdate" value="2026-09-28"><input id="starttime" value="12:00"><input id="pid" type="number" placeholder="节目 ID">
<input id="sid" type="number" placeholder="排期 ID"><input id="newpid" type="number" placeholder="替换节目 ID"><input id="actualstart" value="12:00">
<input id="actualduration" type="number" value="30" placeholder="实播分钟"><input id="actualpid" type="number" placeholder="实播节目 ID，可空"></div>
<button onclick="schedule()">排期</button><button onclick="replace()">替换</button><button onclick="playout()">记录实播</button><button onclick="reconcile()">对账</button><pre id="result"></pre></section>

<section><h2>复核批次</h2>
<p class="meta">排期或替换一变，授权窗口立即失效重算。两人同时提交同一批次时只留下先到结果，后到者保存草稿与差异。写入失败后从最后确认项继续；旧数据无批次号时回填初始版本。</p>
<div class="grid">
<input id="rv_date" value="2026-09-28" placeholder="复核日期">
<input id="rv_batch" type="number" placeholder="批次 ID">
<input id="rv_version" type="number" value="1" placeholder="版本号">
<input id="rv_by" placeholder="操作人，可空">
</div>
<button onclick="initReview()">发起复核</button>
<button onclick="confirmReview()">确认结果</button>
<button onclick="retryReview()">重试未决项</button>
<button class="sec" onclick="loadReviews()">列出该日期批次</button>
<div id="review"></div>
<pre id="rv_result"></pre></section>

<script>
const api=async(url,body)=>{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();out(j);return j};
const out=x=>document.querySelector('#result').textContent=JSON.stringify(x,null,2);
async function load(){document.querySelector('#state').textContent=JSON.stringify(await (await fetch('/api/state')).json(),null,2)}
function addProgram(){api('/api/programs',{title:title.value,kind:kind.value,duration_minutes:+duration.value,start_date:start.value,end_date:end.value,region:region.value,regions:[region.value],sponsor:sponsor.value||null,cooldown_minutes:+cooldown.value})}
function schedule(){api('/api/schedule',{air_date:airdate.value,start_time:starttime.value,program_id:+pid.value,region:region.value})}
function replace(){api('/api/slots/'+sid.value+'/replace',{new_program_id:+newpid.value})}
function playout(){api('/api/playout',{slot_id:+sid.value,actual_start:actualstart.value,actual_duration_minutes:+actualduration.value,actual_program_id:actualpid.value?+actualpid.value:null})}
function reconcile(){api('/api/reconcile',{date:airdate.value})}

const rvOut=x=>document.querySelector('#rv_result').textContent=JSON.stringify(x,null,2);
async function initReview(){
  const r=await api('/api/reviews',{air_date:rv_date.value,note:'页面发起',created_by:rv_by.value||''});
  if(r&&r.ok){rv_batch.value=r.review.id;rv_version.value=r.review.version;renderReview(r.review);}
}
async function confirmReview(){
  const r=await api('/api/reviews/'+rv_batch.value+'/confirm',{version:+rv_version.value,confirmed_by:rv_by.value||''});
  if(r&&r.ok){
    if(r.status==='confirmed'){rv_version.value=r.batch.version;renderReview(r.batch);}
    else if(r.status==='superseded'){rv_batch.value=r.draft_batch_id;rv_version.value=r.batch.version;renderReview(r.batch);}
  }
}
async function retryReview(){
  const r=await api('/api/reviews/'+rv_batch.value+'/retry',{});
  if(r&&r.ok){rv_version.value=r.batch.version;renderReview(r.batch);}
}
async function loadReviews(){
  const r=await (await fetch('/api/reviews?date='+encodeURIComponent(rv_date.value))).json();
  const box=document.querySelector('#review');
  if(!r.reviews||!r.reviews.length){box.innerHTML='<p class="meta">该日期暂无复核批次</p>';return;}
  box.innerHTML='<table><tr><th>批次</th><th>状态</th><th>版本</th><th>base</th><th>备注</th><th>更新时间</th></tr>'+
    r.reviews.map(b=>`<tr><td><a href="#" onclick="openReview(${b.id});return false">#${b.id}</a></td><td>${b.status}</td><td>${b.version}</td><td>${b.base_version}</td><td>${b.note}</td><td>${b.updated_at}</td></tr>`).join('')+'</table>';
}
async function openReview(id){
  const r=await (await fetch('/api/reviews/'+id)).json();
  if(r.review){rv_batch.value=r.review.id;rv_version.value=r.review.version;renderReview(r.review);}
}
function renderReview(b){
  const box=document.querySelector('#review');
  const head=`<p class="meta">批次 #${b.id} · 状态 <b>${b.status}</b> · 版本 ${b.version} · 已确认 ${b.confirmed_count}/${b.total_count}${b.failed_count?` · <span class="blocked">失败 ${b.failed_count}</span>`:''}</p>`;
  const rows=b.items.map(it=>{
    const intervals=(it.playable_intervals||[]).map(iv=>`<span class="pill on">${iv[0]}–${iv[1]}</span>`).join(' ');
    const diff=it.diff&&Object.keys(it.diff).length?`<div class="diff">差异: ${Object.entries(it.diff).map(([k,v])=>`${k}: ${JSON.stringify(v[0])} → ${JSON.stringify(v[1])}`).join('；')}</div>`:'';
    const status=it.blocked?`<span class="pill off">阻断</span>`:`<span class="pill on">可播</span>`;
    const reason=it.blocked?`<div class="blocked">${it.blocked_reason||''}</div>`:'<div class="ok">通过</div>';
    return `<tr><td>#${it.slot_id}<br><span class="meta">${it.program_title||''} (${it.program_kind||''})</span></td>
      <td>${it.start_time}<br><span class="meta">${it.duration_minutes} 分钟 · ${it.region}</span></td>
      <td>${intervals||'<span class="meta">无</span>'}</td>
      <td>${status}${reason}${diff}</td>
      <td class="meta">${it.check_status}</td></tr>`;
  }).join('');
  box.innerHTML=head+'<table><tr><th>排期</th><th>播出</th><th>可播区间</th><th>阻断原因 / 差异</th><th>条目状态</th></tr>'+rows+'</table>';
}
load();
</script>
</html>
